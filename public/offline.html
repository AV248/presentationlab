<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Presentation Buddy</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #f3ebdf; color: #2b2723;
        font: 1rem/1.7 Georgia, 'Times New Roman', serif;
      }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.4rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 1rem; }
      a { color: inherit; }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1816; color: #efe8de; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Presentation Buddy needs a connection to open this page. Your own drafts, notes and
        bookmarks are saved on this device, so nothing you wrote has gone anywhere.
      </p>
      <p><a href="/">Try the library again</a></p>
    </main>
  </body>
</html>
