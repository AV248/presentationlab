      Fonts load without blocking first paint.

      This deliberately avoids the widespread media-swap trick, which relies
      on an inline event handler. The production CSP sets script-src 'self'
      with no unsafe-inline, so that handler would never fire and every font
      would silently fail. preload plus a plain stylesheet gets the same
      non-blocking load with no script at all.
    -->
