<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentation Lab</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
</head>
<body>
<div id="toast-container"></div>

<div class="app-shell">

  <!-- ===== LEFT SIDEBAR ===== -->
  <aside class="sidebar-left">
    <a href="/" class="brand">
      <img src="l.png" alt="logo" class="brand-logo" />
      <div>
        <div class="brand-name">Presentation Lab</div>
        <div class="brand-parent">by Fake International Bank</div>
      </div>
    </a>

    <a href="/" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="/leaderboard.html" class="nav-item">
      <span class="nav-icon">🏆</span>
      <span class="nav-label">Leaderboard</span>
    </a>
    <a href="/creativecreator.html" class="nav-item" id="nav-create-link">
      <span class="nav-icon">✏️</span>
      <span class="nav-label">Create</span>
    </a>

    <button class="nav-create-btn" onclick="location.href='/creativecreator.html'">
      <span>✏️</span>
      <span>New Presentation</span>
    </button>

    <div class="sidebar-spacer"></div>

    <div id="user-chip-wrap">
      <div id="user-chip" class="user-chip hidden">
        <div class="user-avatar" id="sidebar-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-name">—</div>
          <div class="user-handle">
            <button onclick="handleSignout()" style="background:none;border:none;color:var(--stone);font-size:0.72rem;cursor:pointer;padding:0;font-family:inherit;">Sign out</button>
          </div>
        </div>
      </div>
      <a href="/auth.html" class="btn btn-outline btn-full" id="signin-link" style="margin-top:8px;">Sign in</a>
    </div>
  </aside>

  <!-- ===== CENTER FEED ===== -->
  <main class="feed">
    <div class="feed-header">
      <h1 class="feed-title">Presentation Lab</h1>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="latest">Latest</button>
        <button class="filter-tab" data-filter="views">Most Viewed</button>
        <button class="filter-tab" data-filter="avr">AVR Picks</button>
        <button class="filter-tab" data-filter="community">Community</button>
      </div>
    </div>
    <div id="feed-content">
      <div class="feed-empty">
        <div class="spinner" style="margin:0 auto 16px;"></div>
        <p>Loading presentations…</p>
      </div>
    </div>
  </main>

  <!-- ===== RIGHT SIDEBAR ===== -->
  <aside class="sidebar-right">
    <div class="widget">
      <h3 class="widget-title">🏆 Top Writers</h3>
      <div id="lb-preview">
        <div class="skeleton" style="height:14px;margin-bottom:10px;"></div>
        <div class="skeleton" style="height:14px;margin-bottom:10px;width:80%;"></div>
        <div class="skeleton" style="height:14px;width:60%;"></div>
      </div>
      <a href="/leaderboard.html" style="display:block;margin-top:12px;font-size:0.8rem;color:var(--terra);font-weight:600;text-align:center;">View full leaderboard →</a>
    </div>

    <div class="widget">
      <h3 class="widget-title">👑 AVR Picks</h3>
      <div id="avr-preview">
        <div class="skeleton" style="height:14px;margin-bottom:10px;"></div>
        <div class="skeleton" style="height:14px;margin-bottom:10px;width:80%;"></div>
        <div class="skeleton" style="height:14px;width:60%;"></div>
      </div>
    </div>

    <div class="widget" style="background:linear-gradient(135deg,rgba(201,108,84,0.08),var(--sand-warm));">
      <div style="font-size:0.8rem;color:var(--brown);">
        <strong style="color:var(--espresso);display:block;margin-bottom:4px;">Powered by</strong>
        <a href="https://finbgold.netlify.app" target="_blank" style="color:var(--terra);font-weight:700;text-decoration:underline;">Fake International Bank</a>
        <div style="margin-top:8px;color:var(--stone);font-size:0.73rem;">Share speeches. Earn recognition. Build your voice.</div>
      </div>
    </div>
  </aside>
</div>

<!-- ===== BOTTOM NAV (mobile) ===== -->
<nav class="bottom-nav">
  <button class="bottom-nav-btn active" onclick="location.href='/'">
    <span class="bottom-nav-icon">🏠</span><span>Home</span>
  </button>
  <button class="bottom-nav-btn" onclick="location.href='/leaderboard.html'">
    <span class="bottom-nav-icon">🏆</span><span>Top</span>
  </button>
  <button class="bottom-nav-btn" onclick="location.href='/creativecreator.html'">
    <span class="bottom-nav-icon">✏️</span><span>Create</span>
  </button>
  <button class="bottom-nav-btn" id="mobile-auth-btn" onclick="location.href='/auth.html'">
    <span class="bottom-nav-icon">👤</span><span>Sign in</span>
  </button>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, doc, updateDoc, increment, deleteField
} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDwUYRjUe7wKHp64d1vfYV-UDvnXaUuQVY",
  authDomain: "reflectioncapturedthoughts.firebaseapp.com",
  projectId: "reflectioncapturedthoughts",
  storageBucket: "reflectioncapturedthoughts.firebasestorage.app",
  messagingSenderId: "331335730832",
  appId: "1:331335730832:web:731df65bd40f9646adfa15"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let allPosts = [];
let currentFilter = 'latest';

// ===== UTILS =====
function esc(s=""){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function timeAgo(seconds){if(!seconds)return"";const d=Math.floor((Date.now()/1000-seconds));if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+"m";if(d<86400)return Math.floor(d/3600)+"h";if(d<604800)return Math.floor(d/86400)+"d";return new Date(seconds*1000).toLocaleDateString();}
function initials(name){return(name||"?").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);}
function toast(msg,type="info"){const c=document.getElementById("toast-container");const t=document.createElement("div");t.className=`toast toast-${type}`;t.textContent=msg;c.appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity 0.3s";setTimeout(()=>t.remove(),300);},3500);}

// ===== AUTH =====
onAuthStateChanged(auth, user => {
  currentUser = user;
  const sidebarAvatar = document.getElementById("sidebar-avatar");
  const sidebarName = document.getElementById("sidebar-name");
  const userChip = document.getElementById("user-chip");
  const signinLink = document.getElementById("signin-link");
  const mobileBtn = document.getElementById("mobile-auth-btn");

  if (user) {
    signinLink.classList.add("hidden");
    userChip.classList.remove("hidden");
    sidebarAvatar.textContent = initials(user.displayName || user.email);
    sidebarName.textContent = user.displayName || user.email.split("@")[0];
    mobileBtn.innerHTML = `<span class="bottom-nav-icon">👤</span><span>${initials(user.displayName||user.email)}</span>`;
    mobileBtn.onclick = () => handleSignout();
  } else {
    signinLink.classList.remove("hidden");
    userChip.classList.add("hidden");
    mobileBtn.innerHTML = `<span class="bottom-nav-icon">👤</span><span>Sign in</span>`;
    mobileBtn.onclick = () => location.href = "/auth.html";
  }
  // Re-render to update interaction states
  if (allPosts.length) renderFeed(getFilteredPosts());
});

window.handleSignout = async () => {
  await signOut(auth);
  toast("Signed out.", "info");
};

// ===== DATA =====
async function loadData() {
  const [snapAdmin, snapUser] = await Promise.all([
    getDocs(collection(db, "presentations")),
    getDocs(collection(db, "bloggerblogs"))
  ]);

  allPosts = [];
  snapAdmin.forEach(d => {
    allPosts.push({ id: d.id, ...d.data(), _source: "aavrit", _col: "presentations", _author: "AVR", _role: "AVR" });
  });
  snapUser.forEach(d => {
    const data = d.data();
    allPosts.push({ id: d.id, ...data, _source: "community", _col: "bloggerblogs", _author: data.authorName || "Content Writer", _role: "Content Writer" });
  });

  allPosts.sort((a, b) => {
    const aT = a.createdAt?.seconds || Number(a.id) || 0;
    const bT = b.createdAt?.seconds || Number(b.id) || 0;
    return bT - aT;
  });

  renderFeed(getFilteredPosts());
  loadSidebar();
}

function getFilteredPosts() {
  let data = [...allPosts];
  if (currentFilter === "views") data.sort((a,b)=>(b.views||0)-(a.views||0));
  if (currentFilter === "avr") data = data.filter(p=>p._source==="aavrit");
  if (currentFilter === "community") {
    // Show all posts, community filter just means all (AVR shown highlighted)
  }
  return data;
}

// ===== RENDER FEED =====
function renderFeed(data) {
  const feed = document.getElementById("feed-content");
  if (!data.length) {
    feed.innerHTML = `<div class="feed-empty"><div class="feed-empty-icon">📭</div><div class="feed-empty-title">Nothing here yet</div><div class="feed-empty-text">Be the first to share a presentation.</div></div>`;
    return;
  }

  const uid = currentUser?.uid;
  feed.innerHTML = data.map(post => {
    const isAVR = post._source === "aavrit";
    const isLiked = uid && post.likedBy?.[uid];
    const isDisliked = uid && post.dislikedBy?.[uid];
    const isSaved = uid && post.savedBy?.[uid];
    const t = post.createdAt?.seconds || 0;
    const tags = (post.Tags || post.tags || "").split(",").map(s=>s.trim()).filter(Boolean).slice(0,4);
    const preview = post.Preview || post.preview || post.Content || post.content || "";
    const title = post.Title || post.title || "Untitled";
    const category = post.Category || post.category || "General";

    return `<article class="post-card${isAVR?" avr-post":""}" data-post-id="${post.id}" data-post-col="${post._col}">
      <div class="post-avatar-col">
        <div class="post-avatar${isAVR?" avr-avatar":""}">${initials(post._author)}</div>
      </div>
      <div class="post-body">
        <div class="post-header">
          <span class="post-name">${esc(post._author)}</span>
          <span class="post-badge ${isAVR?"badge-avr":"badge-writer"}">${isAVR?"AVR":"Writer"}</span>
          ${t ? `<span class="post-time">· ${timeAgo(t)}</span>` : ""}
          <span class="post-category" style="margin-left:4px;">${esc(category)}</span>
        </div>
        <h3 class="post-title">${esc(title)}</h3>
        <p class="post-text">${esc(preview.substring(0,200))}</p>
        ${tags.length ? `<div class="post-tags">${tags.map(t=>`<span class="post-tag">${esc(t)}</span>`).join("")}</div>` : ""}
        <div class="post-actions" onclick="event.stopPropagation()">
          <button class="action-btn${isLiked?" liked":""}" data-action="like" data-post-id="${post.id}" data-post-col="${post._col}">
            <span class="action-icon">❤️</span> ${post.likeCount||0}
          </button>
          <button class="action-btn${isDisliked?" disliked":""}" data-action="dislike" data-post-id="${post.id}" data-post-col="${post._col}">
            <span class="action-icon">👎</span> ${post.dislikeCount||0}
          </button>
          <button class="action-btn" data-action="share" data-post-id="${post.id}" data-post-col="${post._col}">
            <span>🔗</span> Share
          </button>
          <button class="action-btn${isSaved?" saved":""}" data-action="save" data-post-id="${post.id}" data-post-col="${post._col}">
            <span>${isSaved?"🔖":"🔖"}</span> ${isSaved?"Saved":"Save"}
          </button>
          <span class="views-chip">👁 ${post.views||0}</span>
        </div>
      </div>
    </article>`;
  }).join("");

  // Attach card click listener
  document.querySelectorAll(".post-card").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest(".post-actions")) return;
      const { postId, postCol } = card.dataset;
      window.location.href = `/presentation.html?id=${encodeURIComponent(postId)}&src=${postCol}`;
    });
  });

  // Attach action listeners
  document.querySelectorAll("[data-action]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const { action, postId, postCol } = btn.dataset;
      const post = allPosts.find(p => p.id === postId && p._col === postCol);
      if (!post) return;
      handleAction(action, post, btn);
    });
  });
}

// ===== INTERACTIONS =====
async function handleAction(action, post, btn) {
  if (action === "share") {
    const url = `${location.origin}/presentation.html?id=${post.id}&src=${post._col}`;
    if (navigator.share) {
      try { await navigator.share({ title: post.Title || post.title, url }); } catch {}
    } else {
      await navigator.clipboard.writeText(url).catch(() => prompt("Copy this link:", url));
      toast("Link copied!", "success");
    }
    return;
  }

  if (!currentUser) { toast("Sign in to interact with posts.", "info"); location.href = "/auth.html"; return; }

  const uid = currentUser.uid;
  const postRef = doc(db, post._col, post.id);

  if (action === "like") {
    const isLiked = post.likedBy?.[uid];
    const isDisliked = post.dislikedBy?.[uid];
    const updates = {};
    if (isLiked) {
      updates[`likedBy.${uid}`] = deleteField();
      updates.likeCount = increment(-1);
      post.likeCount = Math.max(0, (post.likeCount||0) - 1);
      delete (post.likedBy||{})[uid];
      if (post.authorUid) await updateDoc(doc(db, "bloggers", post.authorUid), { points: increment(-1) }).catch(()=>{});
    } else {
      updates[`likedBy.${uid}`] = true;
      updates.likeCount = increment(1);
      post.likeCount = (post.likeCount||0) + 1;
      if (!post.likedBy) post.likedBy = {};
      post.likedBy[uid] = true;
      if (isDisliked) {
        updates[`dislikedBy.${uid}`] = deleteField();
        updates.dislikeCount = increment(-1);
        post.dislikeCount = Math.max(0, (post.dislikeCount||0) - 1);
        delete (post.dislikedBy||{})[uid];
      }
      if (post.authorUid) await updateDoc(doc(db, "bloggers", post.authorUid), { points: increment(1) }).catch(()=>{});
    }
    await updateDoc(postRef, updates).catch(() => toast("Error updating like.", "error"));
  }

  if (action === "dislike") {
    const isDisliked = post.dislikedBy?.[uid];
    const isLiked = post.likedBy?.[uid];
    const updates = {};
    const prevDislikeCount = post.dislikeCount || 0;
    if (isDisliked) {
      updates[`dislikedBy.${uid}`] = deleteField();
      updates.dislikeCount = increment(-1);
      post.dislikeCount = Math.max(0, prevDislikeCount - 1);
      delete (post.dislikedBy||{})[uid];
      // Restore point if this was the 3rd dislike
      if (prevDislikeCount % 3 === 0 && post.authorUid) {
        await updateDoc(doc(db, "bloggers", post.authorUid), { points: increment(1) }).catch(()=>{});
      }
    } else {
      updates[`dislikedBy.${uid}`] = true;
      updates.dislikeCount = increment(1);
      post.dislikeCount = prevDislikeCount + 1;
      if (!post.dislikedBy) post.dislikedBy = {};
      post.dislikedBy[uid] = true;
      if (isLiked) {
        updates[`likedBy.${uid}`] = deleteField();
        updates.likeCount = increment(-1);
        post.likeCount = Math.max(0, (post.likeCount||0) - 1);
        delete (post.likedBy||{})[uid];
        if (post.authorUid) await updateDoc(doc(db, "bloggers", post.authorUid), { points: increment(-1) }).catch(()=>{});
      }
      // Every 3 dislikes costs author 1 point
      if ((prevDislikeCount + 1) % 3 === 0 && post.authorUid) {
        await updateDoc(doc(db, "bloggers", post.authorUid), { points: increment(-1) }).catch(()=>{});
      }
    }
    await updateDoc(postRef, updates).catch(() => toast("Error updating dislike.", "error"));
  }

  if (action === "save") {
    const isSaved = post.savedBy?.[uid];
    const updates = {};
    if (isSaved) {
      updates[`savedBy.${uid}`] = deleteField();
      updates.saveCount = increment(-1);
      post.saveCount = Math.max(0, (post.saveCount||0) - 1);
      delete (post.savedBy||{})[uid];
      toast("Removed from saved.", "info");
    } else {
      updates[`savedBy.${uid}`] = true;
      updates.saveCount = increment(1);
      post.saveCount = (post.saveCount||0) + 1;
      if (!post.savedBy) post.savedBy = {};
      post.savedBy[uid] = true;
      toast("Saved!", "success");
    }
    await updateDoc(postRef, updates).catch(() => toast("Error saving.", "error"));
  }

  // Re-render the feed to reflect updated state
  renderFeed(getFilteredPosts());
}

// ===== FILTER TABS =====
document.querySelectorAll(".filter-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll(".filter-tab").forEach(b => b.classList.toggle("active", b === btn));
    renderFeed(getFilteredPosts());
  });
});

// ===== RIGHT SIDEBAR =====
async function loadSidebar() {
  // Leaderboard preview
  const lbDiv = document.getElementById("lb-preview");
  try {
    const snap = await getDocs(collection(db, "bloggers"));
    const users = [];
    snap.forEach(d => {
      const data = d.data();
      if ((data.points || 0) > 0 || true) users.push({ id: d.id, ...data });
    });
    users.sort((a,b)=>(b.points||0)-(a.points||0));
    const top5 = users.filter(u=>u.fullName||u.displayName).slice(0,5);
    const medals = ["🥇","🥈","🥉","4️⃣","5️⃣"];
    lbDiv.innerHTML = top5.length ? top5.map((u,i)=>`
      <div class="leaderboard-row">
        <span class="lb-rank${i===0?" gold":i===1?" silver":i===2?" bronze":""}">${medals[i]}</span>
        <div class="lb-avatar">${initials(u.fullName||u.displayName)}</div>
        <span class="lb-name">${esc(u.fullName||u.displayName||"User")}</span>
        <span class="lb-pts">${u.points||0}pts</span>
      </div>`).join("") : `<p style="font-size:0.82rem;color:var(--stone);text-align:center;padding:10px 0;">No data yet. Create posts to earn points!</p>`;
  } catch { lbDiv.innerHTML = `<p style="font-size:0.8rem;color:var(--stone);">Could not load.</p>`; }

  // AVR picks preview
  const avrDiv = document.getElementById("avr-preview");
  const avrPosts = allPosts.filter(p=>p._source==="aavrit").slice(0,4);
  avrDiv.innerHTML = avrPosts.length ? avrPosts.map(p=>`
    <div class="avr-pick-preview" onclick="location.href='/presentation.html?id=${p.id}&src=presentations'">
      <div class="avr-pick-title">${esc(p.Title||"Untitled")}</div>
      <div class="avr-pick-meta">${esc(p.Category||"General")} · ${p.views||0} views</div>
    </div>`).join("") : `<p style="font-size:0.82rem;color:var(--stone);text-align:center;padding:10px 0;">No AVR picks yet.</p>`;
}

loadData();
</script>
</body>
</html>
